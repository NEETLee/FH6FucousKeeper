; FH6FocusKeeper - 车辆 profile (Subaru 22B STI)
;
; 把这一辆车的「成本 / 技能树形状 / 专属模板图」封装在这个文件夹里。
; 以后出了效率更高的车，复制本文件夹改名（如 cars/XXX/），改下面的值即可。
;
; 可选：把该车专属的模板图放进本文件夹，引擎会优先用本文件夹里的图，
; 找不到时回退到共享的 assets/templates。专属图一般是：
;   consumablecar.png  removecarobject.png  CCbrand.png  newCC.png  newcartag.png

[Car]
Name=Subaru 22B STI
CostCR=81700
CostSP=30

[SkillTree]
; 技能树点击方向序列（从进入熟练度界面后开始）：右,上,上,上,左
; 支持 RIGHT/LEFT/UP/DOWN（或简写 R/L/U/D），逗号或空格分隔。
Dirs=RIGHT,UP,UP,UP,LEFT
